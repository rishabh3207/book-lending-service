        roles: [MEMBER]


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: LIBRARIAN

logging:
  pattern:
    level: "%5p [%X{requestId:-} %X{user:-}]"