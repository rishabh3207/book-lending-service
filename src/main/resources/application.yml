spring:
  application:
    name: book-lending
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:library}
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Demo data lives in db/seed. Production sets FLYWAY_LOCATIONS=classpath:db/migration.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

library:
  loan:
    max-active-loans: ${MAX_ACTIVE_LOANS:3}
    loan-duration-days: ${LOAN_DURATION_DAYS:14}
  security:
    users:
      - username: librarian
        password: "{bcrypt}$2y$10$/FG95SlyElNzwbIKcDCJLuLCgZ001JWKGhOYwY2GcSHkHpYXxt836"
        roles: [LIBRARIAN]
      - username: rishabh@gmail.com
        password: "{bcrypt}$2y$10$oJAwXN/TzTbkKdgLYU6jy.U4njLM.Izw9aJ0CXYE89pI450Bn/Dyi"
        roles: [MEMBER]
      - username: shivamgarg@gmail.com
