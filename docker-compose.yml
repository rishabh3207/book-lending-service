services:
  postgres:
    image: postgres:16
    container_name: library-db
    environment:
      POSTGRES_DB: ${DB_NAME:-library}
      POSTGRES_USER: ${DB_USERNAME:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-library}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: